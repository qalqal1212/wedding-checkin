<div class="app-shell admin-login">
  <header class="app-header admin-login__header">
    <div class="app-header__brand">Admin Access</div>
    <nav class="app-header__actions">
      <a class="app-link-pill" routerLink="/">Guest Search</a>
    </nav>
  </header>

  <section class="app-panel app-panel--hero admin-login__card">
    <h1 class="app-title">Admin Login</h1>

    <form class="admin-login__form" [formGroup]="loginForm" (ngSubmit)="login()">
      <input
        class="app-input"
        type="email"
        formControlName="email"
        placeholder="Admin email"
        aria-label="Admin email"
      />
      <input
        class="app-input"
        type="password"
        formControlName="password"
        placeholder="Password"
        aria-label="Password"
      />
      <button class="app-button app-button--primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Checking...' : 'Enter Admin' }}
      </button>
    </form>

    @if (errorMessage) {
      <p class="app-error">{{ errorMessage }}</p>
    }
  </section>
</div>
